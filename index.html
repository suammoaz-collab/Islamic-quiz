<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>مسابقة المعرفة الإسلامية</title>
<style>
:root{--bg:#0b1220;--card:#131f32;--card2:#192941;--green:#28c76f;--gold:#ffd166;--blue:#56b6ff;--text:#f4f7fb;--muted:#a9b8cc;--red:#ff6b6b;--line:#2a3d58}
body.light{--bg:#f3f6fc;--card:#fff;--card2:#edf2fa;--green:#16894b;--gold:#e0a800;--blue:#2374c6;--text:#172337;--muted:#5b687c;--red:#c83f4d;--line:#d6dfec}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#142945,var(--bg) 60%);font-family:Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh}
body.light{background:linear-gradient(135deg,#f9fbff,#eaf0f9)}
header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.hl{width:min(1000px,94%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:clamp(18px,3.5vw,26px)}
header p{margin:2px 0 0;color:var(--muted);font-size:12px}
.wrap{width:min(1000px,94%);margin:20px auto 60px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat,.category,.card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:16px}
.stat{text-align:center}.stat b{display:block;font-size:22px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.category h3{margin:0 0 6px}.category p{color:var(--muted);font-size:13px;line-height:1.6;min-height:40px;margin:0 0 10px}
.lockedcat{opacity:.8}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.lvbtn small{display:block;font-weight:normal;font-size:11px;margin-top:2px}
button{border:0;border-radius:10px;padding:12px 10px;font:inherit;font-weight:bold;cursor:pointer;background:var(--green);color:#06140b}
button:disabled{background:#46566b;color:#c1c9d4;cursor:not-allowed}
.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.gold{background:var(--gold);color:#271b00}
.hidden{display:none!important}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.timer{display:flex;align-items:center;gap:10px;margin:8px 0 16px}
.tnum{font-size:26px;font-weight:bold;min-width:36px;text-align:center;color:var(--gold)}
.tback{flex:1;height:12px;border-radius:20px;background:#24354b;overflow:hidden}
#tbar{height:100%;width:100%;background:var(--green);transition:width .1s linear}
#tbar.low{background:var(--red)}
.card{padding:clamp(16px,4vw,26px)}
.card h2{font-size:clamp(18px,3vw,24px);line-height:1.6;margin:0 0 18px}
.answers{display:grid;gap:10px}
.answer{background:var(--card2);color:var(--text);text-align:right;border:1px solid var(--line);font-size:16px;line-height:1.5;padding:12px 14px}
.answer:hover:not(:disabled){border-color:var(--blue)}
.answer.correct{background:#123c2a!important;border-color:var(--green)!important;color:#fff}
.answer.wrong{background:#48232b!important;border-color:var(--red)!important;color:#fff}
.feedback{margin-top:14px;padding:14px;border-radius:10px;line-height:1.8;background:var(--bg);border:1px solid var(--line)}
.feedback strong{color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.small{font-size:12px;color:var(--muted)}
.result{text-align:center}.result h2{color:var(--gold)}.big{font-size:44px;font-weight:bold;margin:10px}
.share{margin-top:18px}
#birdReminder{position:fixed;left:14px;bottom:16px;display:flex;align-items:center;gap:8px;cursor:pointer;z-index:9;transition:.3s}
.bp{background:var(--card);color:var(--gold);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:bold;font-size:12px}
.gift{cursor:pointer;text-align:center;background:linear-gradient(145deg,var(--card),var(--card2));border:2px dashed var(--gold);border-radius:18px;padding:18px;margin-bottom:16px;user-select:none}
.giftIcon{font-size:52px;display:inline-block}
.giftIcon.shake{animation:shake .5s}
.giftText{margin-top:8px;font-size:clamp(16px,2.6vw,20px);line-height:1.9;min-height:30px}
.giftText.pop{animation:pop .5s}
.giftTag{display:inline-block;margin-top:8px;padding:2px 12px;border-radius:20px;background:var(--gold);color:#271b00;font-size:12px;font-weight:bold}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<header>
  <div class="hl">
    <div>
      <h1>📚 مسابقة المعرفة الإسلامية</h1>
      <p>تعلّم • اختبر نفسك • ارتقِ بالمستوى</p>
    </div>
    <button id="themeBtn" class="secondary" onclick="toggleTheme()" style="padding:8px 12px;font-size:12px">☀️ فاتح</button>
  </div>
</header>

<div id="birdReminder" onclick="hideBird()"><span style="font-size:26px">✨</span><span class="bp">صلِّ على النبي ﷺ (اضغط للإخفاء)</span></div>

<main class="wrap">
  <section id="home">
    <div class="gift" onclick="openGift()">
      <div class="giftIcon" id="giftIcon">🎁</div>
      <div class="giftText" id="giftText">صندوق السعادة، اضغط عليه وشوف إيه المفاجأة</div>
      <div class="giftTag hidden" id="giftTag"></div>
    </div>
    <div class="stats">
      <div class="stat">⭐ النجوم<b id="score">0</b></div>
      <div class="stat">✅ مستويات ناجحة<b id="completed">0</b></div>
    </div>
    <div class="grid" id="categories"></div>
    <div class="share">
      <button class="gold" onclick="shareWebsite()" style="width:100%">🔗 شارك المسابقة مع أصحابك</button>
    </div>
    <p class="small" style="text-align:center;margin-top:16px">كل سؤال له 15 ثانية. اجمع 7 من 10 علشان تفتح المستوى اللي بعده. كل إجابة صح = نجمة.</p>
  </section>

  <section id="quiz" class="hidden">
    <div class="topline"><span id="quizMeta"></span><span id="qCounter" class="small"></span><button class="secondary" onclick="quitQuiz()">خروج</button></div>
    <div class="timer"><div class="tnum" id="tnum">15</div><div class="tback"><div id="tbar"></div></div></div>
    <div class="card">
      <h2 id="questionText"></h2>
      <div class="answers" id="answers"></div>
      <div id="feedback" class="feedback hidden"></div>
      <div class="row"><button id="nextBtn" class="gold hidden" onclick="nextQuestion()">السؤال التالي ←</button></div>
    </div>
  </section>

  <section id="result" class="hidden">
    <div class="card result">
      <h2 id="resultTitle"></h2>
      <div class="big" id="resultScore"></div>
      <p id="resultText"></p>
      <div class="row" style="justify-content:center">
        <button id="nextLvl" class="gold" onclick="start(secIdx,lv+1)">المستوى التالي ←</button>
        <button class="secondary" onclick="start(secIdx,lv)">إعادة المستوى</button>
        <button class="secondary" onclick="shareScore()">شارك نتيجتك</button>
        <button class="secondary" onclick="goHome()">الأقسام</button>
      </div>
    </div>
  </section>
</main>

<script>
const TIME = 15;
const PASS = 7;
const SECTIONS = [];

/* add(رقم القسم, الاسم, الأيقونة, الوصف, [مستوى1, مستوى2, ...], النجوم المطلوبة لفتحه) */
function add(id, name, icon, desc, levels, need){
  SECTIONS.push({id, name, icon, desc, levels, need: need || 0});
}

let st = {best:{}};
try { st = JSON.parse(localStorage.getItem('quiz_v12')) || {best:{}}; } catch(e) {}
st.best = st.best || {};

let secIdx = 0, sec = null, lv = 0, qs = [], idx = 0, ok = 0, locked = false, timer = null, left = TIME, cur = null;
const $ = id => document.getElementById(id);

function save(){ try { localStorage.setItem('quiz_v12', JSON.stringify(st)); } catch(e) {} }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id){ ['home','quiz','result'].forEach(x => $(x).classList.toggle('hidden', x !== id)); window.scrollTo(0, 0); }
function total(){ return Object.values(st.best).reduce((a, b) => a + b, 0); }

function goHome(){ clearInterval(timer); renderHome(); show('home'); }

function renderHome(){
  const tot = total();
  $('score').textContent = tot;
  $('completed').textContent = Object.values(st.best).filter(v => v >= PASS).length;
  const root = $('categories'); root.innerHTML = '';
  SECTIONS.forEach((s, i) => {
    const isLocked = tot < s.need;
    const el = document.createElement('article');
    el.className = 'category' + (isLocked ? ' lockedcat' : '');
    let html = '<h3>' + s.icon + ' ' + s.name + '</h3><p>' + s.desc + '</p>';
    if (isLocked){
      html += '<button disabled style="width:100%">🔒 يفتح بـ ' + s.need + ' ⭐ (معاك ' + tot + ')</button>';
    } else {
      html += '<div class="lvls">';
      s.levels.forEach((q, j) => {
        const b = st.best[s.id + '-' + j];
        const open = j === 0 || (st.best[s.id + '-' + (j - 1)] || 0) >= PASS;
        html += '<button class="lvbtn" ' + (open ? '' : 'disabled') + ' onclick="start(' + i + ',' + j + ')">' + (open ? '' : '🔒 ') + 'المستوى ' + (j + 1) + '<small>' + (b != null ? b + '/10' : (open ? 'ابدأ' : 'مقفول')) + '</small></button>';
      });
      html += '</div>';
    }
    el.innerHTML = html;
    root.appendChild(el);
  });
}

function start(i, level){
  if (SECTIONS[i].need > total()) return;
  secIdx = i; sec = SECTIONS[i]; lv = level; idx = 0; ok = 0;
  qs = shuffle(sec.levels[level]).map(a => ({q: a[0], a: a[1], opts: shuffle(a.slice(1))}));
  $('quizMeta').textContent = sec.icon + ' ' + sec.name + ' · المستوى ' + (level + 1);
  show('quiz');
  ask();
}

function ask(){
  cur = qs[idx];
  locked = false;
  $('qCounter').textContent = 'السؤال ' + (idx + 1) + ' من ' + qs.length;
  $('questionText').textContent = cur.q;
  const box = $('answers'); box.innerHTML = '';
  cur.opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'answer'; b.textContent = o;
    b.onclick = () => choose(o, b);
    box.appendChild(b);
  });
  $('feedback').classList.add('hidden');
  $('nextBtn').classList.add('hidden');
  left = TIME;
  clearInterval(timer);
  tick(true);
  timer = setInterval(tick, 100);
}

function tick(first){
  if (first !== true) left -= 0.1;
  $('tbar').style.width = Math.max(0, left / TIME * 100) + '%';
  $('tbar').classList.toggle('low', left <= 5);
  $('tnum').textContent = Math.max(0, Math.ceil(left));
  if (left <= 0) timeUp();
}

function mark(){
  document.querySelectorAll('.answer').forEach(b => {
    b.disabled = true;
    if (b.textContent === cur.a) b.classList.add('correct');
  });
}

function choose(o, b){
  if (locked) return;
  locked = true; clearInterval(timer); mark();
  const good = (o === cur.a);
  if (good) ok++; else b.classList.add('wrong');
  feedback(good ? 'إجابة صحيحة ✓ ممتاز!' : 'إجابة غير صحيحة ✗');
}

function timeUp(){
  if (locked) return;
  locked = true; clearInterval(timer); mark();
  feedback('انتهى الوقت ⏰');
}

function feedback(t){
  const f = $('feedback');
  f.classList.remove('hidden');
  f.innerHTML = '<strong></strong><br>الإجابة الصحيحة: <span></span>';
  f.querySelector('strong').textContent = t;
  f.querySelector('span').textContent = cur.a;
  $('nextBtn').textContent = (idx === qs.length - 1) ? 'عرض النتيجة' : 'السؤال التالي ←';
  $('nextBtn').classList.remove('hidden');
}

function nextQuestion(){
  if (idx < qs.length - 1){ idx++; ask(); } else finish();
}

function finish(){
  const k = sec.id + '-' + lv;
  if (ok > (st.best[k] || 0)){ st.best[k] = ok; save(); }
  const pass = ok >= PASS;
  const more = lv + 1 < sec.levels.length;
  $('resultTitle').textContent = pass ? (ok === qs.length ? 'مذهل! العلامة كاملة 🌟' : 'ممتاز! نجحت 🎉') : 'حاول مرة تانية 💪';
  $('resultScore').textContent = ok + '/' + qs.length;
  $('resultText').textContent = (pass
    ? (more ? 'فتحت المستوى ' + (lv + 2) + ' في ' + sec.name + '.' : 'خلصت كل مستويات ' + sec.name + '، ما شاء الله!')
    : 'محتاج ' + PASS + ' إجابات صح على الأقل علشان تنجح.') + ' نجومك الآن: ' + total();
  $('nextLvl').classList.toggle('hidden', !(pass && more));
  show('result');
}

function quitQuiz(){ if (confirm('تخرج؟ نتيجة المستوى ده مش هتتحفظ.')) goHome(); }

function toggleTheme(){
  document.body.classList.toggle('light');
  const l = document.body.classList.contains('light');
  try { localStorage.setItem('quiz_theme', l ? 'light' : 'dark'); } catch(e) {}
  $('themeBtn').textContent = l ? '🌙 داكن' : '☀️ فاتح';
}

function hideBird(){
  const b = $('birdReminder');
  b.style.opacity = '0';
  setTimeout(() => b.style.display = 'none', 300);
}

function doShare(text){
  if (navigator.share) navigator.share({title: 'مسابقة المعرفة الإسلامية', text: text, url: location.href}).catch(() => {});
  else prompt('انسخ الرابط وشاركه:', location.href);
}
function shareWebsite(){ doShare('جرّب مسابقة المعرفة الإسلامية! كل سؤال له 15 ثانية فقط.'); }
function shareScore(){ doShare('جبت ' + ok + ' من ' + qs.length + ' في ' + sec.name + ' (المستوى ' + (lv + 1) + '). جرّب تغلبني!'); }

try { if (localStorage.getItem('quiz_theme') === 'light'){ document.body.classList.add('light'); $('themeBtn').textContent = '🌙 داكن'; } } catch(e) {}

const QUOTES = [
["صبر","«إن مع العسر يسرًا» (سورة الشرح)"],
["صبر","«فاصبر صبرًا جميلًا» (سورة المعارج)"],
["صبر","«إن الله مع الصابرين» (سورة البقرة)"],
["صبر","«واصبر وما صبرك إلا بالله» (سورة النحل)"],
["صبر","«لا تحزن إن الله معنا» (سورة التوبة)"],
["صبر","«وعسى أن تكرهوا شيئًا وهو خير لكم» (سورة البقرة)"],
["صبر","«حسبنا الله ونعم الوكيل» (سورة آل عمران)"],
["صبر","الصبر ليس أن تنتظر فقط، بل أن تحافظ على هدوء قلبك وأنت تنتظر."],
["صبر","ما تأخر عنك لم يضع، هو فقط ينتظر وقته المناسب."],
["صبر","بعض الأبواب تتأخر في الفتح لأن ما خلفها يحتاج منك أن تكون جاهزًا."],
["صبر","كل ليل طويل مهما طال، يأتي بعده فجر."],
["صبر","الصبر على القليل اليوم يصنع الكثير غدًا."],
["صبر","لا تقارن بدايتك بنهاية غيرك."],
["صبر","اهدأ، فالأشياء الكبيرة تُبنى بالتدريج."],
["صبر","الدعاء باب مفتوح لا يُغلق، فاطرقه وأنت واثق."],
["صبر","خطوة صغيرة كل يوم أفضل من انتظار الخطوة الكبيرة."],
["صبر","التعب الذي تحمله اليوم سيصبح قصتك الجميلة بعد حين."],
["صبر","لا بأس أن تتعثر، المهم ألا تتوقف."],
["صبر","الصبر الجميل أن تثق في الله ولا تشتكي لأحد غيره."],
["صبر","كل شيء يمر، حتى الأيام الثقيلة."],
["فرح","«ألا بذكر الله تطمئن القلوب» (سورة الرعد)"],
["فرح","«ولسوف يعطيك ربك فترضى» (سورة الضحى)"],
["فرح","«ولئن شكرتم لأزيدنكم» (سورة إبراهيم)"],
["فرح","«وقولوا للناس حسنًا» (سورة البقرة)"],
["فرح","«فاذكروني أذكركم» (سورة البقرة)"],
["فرح","«تبسمك في وجه أخيك صدقة» (حديث شريف)"],
["فرح","«الكلمة الطيبة صدقة» (حديث شريف)"],
["فرح","«الراحمون يرحمهم الرحمن» (حديث شريف)"],
["فرح","ابتسامتك اليوم قد تكون أجمل ما يراه أحدهم في يومه."],
["فرح","كلمة طيبة منك قد تصلح يوم إنسان كامل."],
["فرح","الفرح الحقيقي يبدأ حين تشكر على ما عندك قبل أن تطلب ما ليس عندك."],
["فرح","افتح الشباك، تنفّس، وتذكّر نعمة صغيرة أنت فيها الآن."],
["فرح","شارك فرحك مع من تحب، فيتضاعف."],
["فرح","اليوم جديد، وفرصتك فيه جديدة."],
["فرح","ضحكة صافية مع من تحب تساوي كثيرًا."],
["فرح","من أحب أن يسعد قلبه فليُسعد قلب غيره."],
["فرح","أبسط الأشياء قد تصنع فرحة: كوب شاي، ودعاء، وحديث طيب."],
["فرح","أنت أقوى مما تظن، وأقرب للفرج مما تتخيل."],
["فرح","لا تؤجل سعادتك لحين تتحسن كل الظروف، ابحث عنها في تفاصيل يومك."],
["فرح","القلب الراضي يجعل الأيام العادية جميلة."],
["معلومة","عدد سور القرآن الكريم 114 سورة."],
["معلومة","أطول سورة في القرآن هي البقرة، وأقصرها الكوثر."],

["معلومة","بدأ التقويم الهجري من هجرة النبي ﷺ إلى المدينة، واعتمده عمر بن الخطاب رضي الله عنه."],
["معلومة","أركان الإسلام خمسة، وأركان الإيمان ستة."],

["معلومة","«المسلم من سلم المسلمون من لسانه ويده» (حديث شريف)"],
["معلومة","من أسماء المدينة المنورة: طيبة وطابة."],

["معلومة","مريم هي المرأة الوحيدة المذكورة باسمها في القرآن الكريم."],
["معلومة","عدد سجدات التلاوة في القرآن 15 سجدة على المشهور."],
["معلومة","أول من آمن من النساء السيدة خديجة رضي الله عنها."],
["معلومة","الحج فرض مرة واحدة في العمر على المسلم المستطيع."],
["معلومة","أول ما يُحاسب عليه العبد يوم القيامة من عمله الصلاة."]
];

let lastQuote = -1;
function openGift(){
  let i;
  do { i = Math.floor(Math.random() * QUOTES.length); } while (i === lastQuote && QUOTES.length > 1);
  lastQuote = i;
  const icon = $('giftIcon');
  icon.classList.remove('shake'); void icon.offsetWidth; icon.classList.add('shake');
  setTimeout(() => {
    const q = QUOTES[i];
    icon.textContent = {'صبر':'🌿','فرح':'😊','معلومة':'💡'}[q[0]];
